[project]
name = "claude-telegram-notifier"
version = "0.1.0"
description = "Send Claude's Markdown output to Telegram from scripts, cron jobs and Claude Code hooks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "markdown-it-py>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only needed to expose the notifier to MCP clients (Claude Desktop, Cowork,
# Claude Code). The send-only core stays dependency-light without it.
# >=2.0: FastMCP was replaced by mcp.server.mcpserver.MCPServer, which is what
# build_server() imports. A 1.x install fails at import, not at call time.
mcp = [
    "mcp>=2.0",
]

[project.scripts]
tg-notify = "telegram_notifier.cli:main"
tg-notify-mcp = "telegram_notifier.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
